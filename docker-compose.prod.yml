# Production deployment — Etsy AI Autopilot / Form & Fern
#
# Deployed as an isolated Docker Compose project (project name:
# etsy-autopilot) directly on an existing Hostinger VPS that ALSO runs an
# unrelated n8n stack. This file is written to never touch that other
# stack:
#   - Own Postgres, own Redis, own persistent volumes, own internal network
#     (etsy_internal) — postgres/redis/worker are NEVER published to the
#     host and are unreachable from outside this compose project.
#   - api and dashboard additionally join the pre-existing EXTERNAL network
#     `n8n_default`, because that is where the shared Traefik reverse proxy
#     (already running as part of the `n8n` project) lives. We route through
#     that existing Traefik via labels instead of binding our own to
#     host ports 80/443, which are already owned by it.
#
# Images are built directly on the VPS from this repo's source (no GHCR,
# no GitHub Actions — see scripts/deploy-vps.sh, which builds api, worker,
# and dashboard ONE AT A TIME to stay within the VPS's 1 CPU / 4GB budget
# alongside the already-running n8n stack).
#
# Run from the repo root on the VPS (e.g. /opt/etsy-autopilot):
#   docker compose -p etsy-autopilot -f docker-compose.prod.yml build api
#   docker compose -p etsy-autopilot -f docker-compose.prod.yml build worker
#   docker compose -p etsy-autopilot -f docker-compose.prod.yml build dashboard
#   docker compose -p etsy-autopilot -f docker-compose.prod.yml run --rm migrate
#   docker compose -p etsy-autopilot -f docker-compose.prod.yml up -d
#
# All secrets are read from a `.env` file that lives ONLY on the VPS
# (/opt/etsy-autopilot/.env) — never committed to this repo. See
# docs/PRODUCTION_DEPLOY.md for the full variable list and exactly which
# values are safe to generate vs. must be entered by hand.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [etsy_internal]
    environment:
      POSTGRES_USER: etsy_autopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: etsy_autopilot
    volumes:
      - etsy_postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etsy_autopilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [etsy_internal]
    volumes:
      - etsy_redis_data:/data
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    networks: [etsy_internal]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://etsy_autopilot:${POSTGRES_PASSWORD}@postgres:5432/etsy_autopilot
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "@etsymagazam/database", "run", "migrate"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    networks: [etsy_internal, n8n_default]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://etsy_autopilot:${POSTGRES_PASSWORD}@postgres:5432/etsy_autopilot
      REDIS_URL: redis://redis:6379
      API_BASE_URL: https://etsy-api.studyoafg.com
      DASHBOARD_BASE_URL: https://etsy-admin.studyoafg.com
      ETSY_OAUTH_REDIRECT_URI: https://etsy-api.studyoafg.com/api/etsy/oauth/callback
      ETSY_WEBHOOK_URL: https://etsy-api.studyoafg.com/api/etsy/webhooks
      # api and dashboard are on different subdomains — the CSRF cookie must
      # be scoped to their shared parent domain so the dashboard's JS can
      # read it (see auth.ts's COOKIE_DOMAIN comment).
      COOKIE_DOMAIN: .studyoafg.com
      BRAND_DISPLAY_NAME: Form & Fern
      STORAGE_LOCAL_PATH: /repo/storage
      # --- autopilot gate: keep closed until explicitly opened up ---
      AUTO_PUBLISH: "${AUTO_PUBLISH:-false}"
      DRY_RUN: "${DRY_RUN:-true}"
    volumes:
      - etsy_storage_data:/repo/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=3", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.etsy-api.rule=Host(`etsy-api.studyoafg.com`)
      - traefik.http.routers.etsy-api.entrypoints=websecure
      - traefik.http.routers.etsy-api.tls.certresolver=mytlschallenge
      - traefik.http.services.etsy-api.loadbalancer.server.port=4000
      # api (unlike dashboard) is on two Docker networks (etsy_internal +
      # n8n_default, needed for the internal Postgres/Redis/worker traffic).
      # Without this, Traefik's Docker provider picks a network to reach
      # the container on its own — and can pick etsy_internal, which
      # Traefik itself isn't attached to, silently blackholing every
      # request (TLS handshake succeeds, but the proxied request just
      # hangs forever). Pin it to the network Traefik actually shares.
      - traefik.docker.network=n8n_default

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    networks: [etsy_internal]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://etsy_autopilot:${POSTGRES_PASSWORD}@postgres:5432/etsy_autopilot
      REDIS_URL: redis://redis:6379
      API_BASE_URL: https://etsy-api.studyoafg.com
      DASHBOARD_BASE_URL: https://etsy-admin.studyoafg.com
      BRAND_DISPLAY_NAME: Form & Fern
      STORAGE_LOCAL_PATH: /repo/storage
      # --- autopilot gate: keep closed until explicitly opened up ---
      # AUTO_PUBLISH/DRY_RUN are env-controlled read-only defaults; the
      # actual pause switch (AutopilotState.isPaused) is a DB row, set to
      # true automatically on first OAuth connect (see etsy-oauth.ts) — it
      # is not an env var. Flip it via the dashboard when ready to unpause.
      AUTO_PUBLISH: "${AUTO_PUBLISH:-false}"
      DRY_RUN: "${DRY_RUN:-true}"
    volumes:
      - etsy_storage_data:/repo/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=3", "http://127.0.0.1:4100/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    # No Traefik labels, no host/external network membership on purpose —
    # the worker is never meant to be reachable from the internet.

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://etsy-api.studyoafg.com
    restart: unless-stopped
    networks: [n8n_default]
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=3", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.etsy-admin.rule=Host(`etsy-admin.studyoafg.com`)
      - traefik.http.routers.etsy-admin.entrypoints=websecure
      - traefik.http.routers.etsy-admin.tls.certresolver=mytlschallenge
      - traefik.http.services.etsy-admin.loadbalancer.server.port=3000

networks:
  etsy_internal:
    driver: bridge
  n8n_default:
    external: true

volumes:
  etsy_postgres_data:
  etsy_redis_data:
  etsy_storage_data:
