name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: etsy_autopilot
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: etsy_autopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etsy_autopilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://etsy_autopilot:ci_password@localhost:5432/etsy_autopilot
      REDIS_URL: redis://localhost:6379
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SESSION_SECRET: ci-session-secret
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — it reads the pinned version from
      # package.json's "packageManager" field. Setting both errors out
      # ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @etsymagazam/database run generate

      - name: Run database migrations
        run: pnpm --filter @etsymagazam/database run migrate

      - name: Typecheck all packages/apps/scripts
        run: |
          pnpm -r run typecheck
          pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm exec vitest run

      - name: Build dashboard (compile check)
        run: pnpm --filter @etsymagazam/dashboard run build

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, worker, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
