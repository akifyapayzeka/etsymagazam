name: Deploy

# PARKED — not the active deploy path. Every attempt to run this (across a
# private repo, then a public repo, default Actions permissions, and a
# raised spending limit) failed with a GitHub Actions runner never getting
# assigned (job created, runner_id 0, no logs, completed in seconds — a
# GitHub-side account/runner-pool issue, not a workflow bug). Production
# now deploys via scripts/deploy-vps.sh (source build directly on the
# target VPS) — see docs/PRODUCTION_DEPLOY.md. Left here, unused, in case
# the underlying GitHub Actions issue gets resolved later and a GHCR-based
# deploy becomes worth reviving.
#
# Builds and pushes production images to GHCR. Manual only (workflow_dispatch)
# — this repo has no automatic production deploy step; a human triggers this,
# then applies docker-compose.prod.yml on the target host themselves (see
# docs/PRODUCTION_DEPLOY.md). Pushing images here never touches any running
# environment by itself.
on:
  workflow_dispatch:
    inputs:
      dashboard_api_base_url:
        description: "Public API URL to bake into the dashboard build (NEXT_PUBLIC_API_BASE_URL). Must match the real production API domain."
        required: true
        default: "https://etsy-api.studyoafg.com"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, worker, dashboard]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            ${{ matrix.app == 'dashboard' && format('NEXT_PUBLIC_API_BASE_URL={0}', github.event.inputs.dashboard_api_base_url) || '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/etsymagazam-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/etsymagazam-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
